[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdl-yolo"
version = "0.1.0"
description = "RDL-YOLO research code for nickel plate defect detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later; third-party notices apply"}
dependencies = [
  "torch>=2.2,<3", "torchvision>=0.17,<0.27", "numpy>=1.26,<3",
  "matplotlib>=3.8,<4", "opencv-python>=4.9,<5", "pillow>=10,<13",
  "pyyaml>=6,<7", "requests>=2.31,<3", "scipy>=1.11,<2",
  "tqdm>=4.66,<5", "psutil>=5.9,<8", "py-cpuinfo>=9,<10",
  "pandas>=2,<4", "seaborn>=0.13,<0.14", "ultralytics-thop>=2,<3",
  "timm==1.0.7", "einops==0.8.2",
]

[project.scripts]
rdl-yolo = "rdl_release.cli:main"

[project.urls]
Repository = "https://github.com/ZiXian-Gao/RDL-YOLO"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]

[tool.setuptools.packages.find]
include = ["ultralytics*", "rdl_release*"]

[tool.setuptools.package-data]
ultralytics = ["**/*.yaml", "**/*.jpg", "**/*.png"]
